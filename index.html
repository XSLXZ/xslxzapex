<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>顺序加载库文件模拟器</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, 'Segoe UI', monospace;
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 20px;
            background: #f5f7fb;
        }
        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            padding: 24px 28px;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 1.8rem;
            margin: 0 0 0.5rem 0;
            color: #1e293b;
        }
        .sub {
            color: #475569;
            border-left: 3px solid #3b82f6;
            padding-left: 12px;
            margin-bottom: 24px;
            font-size: 0.9rem;
        }
        .input-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        input {
            flex: 2;
            min-width: 180px;
            padding: 12px 16px;
            font-size: 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 40px;
            outline: none;
            transition: 0.2s;
        }
        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #2563eb;
            transform: scale(0.97);
        }
        .status {
            background: #f1f5f9;
            padding: 12px 16px;
            border-radius: 20px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #0f172a;
            margin-bottom: 20px;
            word-break: break-all;
        }
        .content-area {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .item-card {
            background: #ffffff;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            transition: 0.1s;
        }
        .item-header {
            background: #f8fafc;
            padding: 10px 18px;
            font-family: monospace;
            font-weight: 600;
            font-size: 0.85rem;
            border-bottom: 1px solid #e2e8f0;
            color: #334155;
        }
        .item-content {
            padding: 18px;
        }
        .item-content pre {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
            background: #fefce8;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            color: #1e293b;
        }
        .item-content img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 16px;
            display: block;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .error-msg {
            color: #b91c1c;
            background: #fee2e2;
            padding: 12px;
            border-radius: 20px;
            text-align: center;
        }
        footer {
            margin-top: 32px;
            text-align: center;
            font-size: 0.75rem;
            color: #64748b;
        }
        hr {
            margin: 16px 0;
            border-color: #e2e8f0;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>📂 顺序加载库文件</h1>
    <div class="sub">输入文件夹名 → 按序号1~n依次加载 txt / png / jpg（自动停止）</div>

    <div class="input-group">
        <input type="text" id="folderInput" placeholder="例如: a 或 ABC" autocomplete="off">
        <button id="loadBtn">🔍 加载</button>
    </div>

    <div class="status" id="statusMsg">
        💡 提示：确保网站通过 http:// 或 https:// 访问，且“库”文件夹与HTML同目录。<br>
        示例路径：<strong>库/文件夹名/1.txt</strong> , <strong>库/文件夹名/2.png</strong> ...
    </div>

    <div id="contentContainer" class="content-area">
        <!-- 动态显示加载内容 -->
    </div>
</div>
<footer>
    ⚙️ 工作原理：顺序尝试 序号 + 扩展名(.txt → .png → .jpg)<br>
    若某一序号所有扩展名均不存在，则停止加载。
</footer>

<script>
    (function() {
        // 配置区 -------------------------------------------------
        const BASE_PATH = '库/';            // 相对路径（同目录下的“库”文件夹）
        const EXTENSIONS = ['.txt', '.png', '.jpg'];   // 按优先级顺序尝试（决定文件类型）
        // -------------------------------------------------------

        const folderInput = document.getElementById('folderInput');
        const loadBtn = document.getElementById('loadBtn');
        const statusDiv = document.getElementById('statusMsg');
        const container = document.getElementById('contentContainer');

        // 辅助：显示状态消息（普通信息）
        function setStatus(msg, isError = false) {
            statusDiv.innerHTML = msg;
            statusDiv.style.background = isError ? '#fee2e2' : '#f1f5f9';
            statusDiv.style.color = isError ? '#b91c1c' : '#0f172a';
        }

        // 清空内容区
        function clearContent() {
            container.innerHTML = '';
        }

        // 根据扩展名渲染内容（返回渲染后的DOM元素）
        function renderItemByUrl(url, ext, index) {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'item-card';

            const header = document.createElement('div');
            header.className = 'item-header';
            // 提取文件名展示
            const fileName = url.split('/').pop();
            header.textContent = `📄 序号 ${index}  →  ${fileName}`;
            itemDiv.appendChild(header);

            const body = document.createElement('div');
            body.className = 'item-content';

            if (ext === '.txt') {
                // 文本文件：fetch内容后放入pre
                // 注意：这里返回Promise，因为需要异步获取文本内容
                return fetch(url)
                    .then(res => {
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        return res.text();
                    })
                    .then(text => {
                        const pre = document.createElement('pre');
                        pre.textContent = text || '(空文件)';
                        body.appendChild(pre);
                        itemDiv.appendChild(body);
                        return itemDiv;
                    })
                    .catch(err => {
                        // 如果fetch文本失败（理论上之前HEAD已经成功，但再保险）
                        body.innerHTML = `<div class="error-msg">⚠️ 读取文本失败: ${err.message}</div>`;
                        itemDiv.appendChild(body);
                        return itemDiv;
                    });
            } 
            else { // .png 或 .jpg
                const img = document.createElement('img');
                img.src = url;
                img.alt = `图片 ${fileName}`;
                img.style.maxWidth = '100%';
                // 图片加载失败时的占位
                img.onerror = () => {
                    img.style.display = 'none';
                    const errSpan = document.createElement('div');
                    errSpan.className = 'error-msg';
                    errSpan.textContent = `🖼️ 图片加载失败: ${fileName}`;
                    body.appendChild(errSpan);
                };
                body.appendChild(img);
                itemDiv.appendChild(body);
                // 图片不需要额外异步，直接返回同步DOM
                return Promise.resolve(itemDiv);
            }
        }

        // 核心加载逻辑：串行尝试序号1,2,3...
        async function loadFolder(folderName) {
            if (!folderName || folderName.trim() === '') {
                setStatus('❌ 请输入文件夹名称', true);
                return;
            }
            // 防止路径遍历攻击：只允许字母数字下划线中文等，但为了通用，使用encodeURIComponent
            const safeFolder = encodeURIComponent(folderName.trim());
            const folderPath = `${BASE_PATH}${safeFolder}/`;
            
            setStatus(`🔍 正在扫描：${folderPath} ...`);
            clearContent();

            let seq = 1;
            let hasMore = true;
            let anyLoaded = false;

            while (hasMore) {
                let foundInSeq = false;
                // 按扩展名顺序尝试当前序号的文件
                for (const ext of EXTENSIONS) {
                    const fileUrl = `${folderPath}${seq}${ext}`;
                    // 使用 HEAD 请求快速检查文件是否存在（避免下载大文件内容前浪费带宽）
                    try {
                        const headResp = await fetch(fileUrl, { method: 'HEAD' });
                        if (headResp.ok) {
                            foundInSeq = true;
                            anyLoaded = true;
                            setStatus(`✅ 正在加载: ${seq}${ext} ...`);
                            
                            // 根据扩展名渲染内容（文本需要二次fetch，图片直接显示）
                            const itemDom = await renderItemByUrl(fileUrl, ext, seq);
                            container.appendChild(itemDom);
                            
                            // 滚动到新内容（可选，优雅一些）
                            itemDom.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            break; // 当前序号已找到文件，不再尝试其他扩展名
                        }
                    } catch (e) {
                        // HEAD 请求网络错误（如CORS或离线），继续尝试下一个扩展名
                        console.warn(`检查失败 ${fileUrl}:`, e);
                    }
                }
                
                if (!foundInSeq) {
                    // 当前序号所有扩展名都不存在 → 结束循环
                    hasMore = false;
                } else {
                    seq++;  // 继续下一个序号
                    // 可选：设置一个最大序号防止无限循环（比如1000）
                    if (seq > 1000) {
                        setStatus(`⚠️ 达到最大序号限制 1000，停止加载`, false);
                        hasMore = false;
                    }
                }
            }

            if (!anyLoaded) {
                setStatus(`❌ 未找到任何文件：路径 ${folderPath} 下没有 1.txt / 1.png / 1.jpg ... 或文件夹不存在`, true);
                container.innerHTML = `<div class="error-msg">📭 文件夹“${folderName}”不存在或没有任何序号文件 (1~n)</div>`;
            } else {
                setStatus(`✨ 加载完成！共加载 ${seq-1} 个文件（序号 1 ~ ${seq-1}）`);
            }
        }

        // 绑定事件
        loadBtn.addEventListener('click', () => {
            const rawName = folderInput.value.trim();
            loadFolder(rawName);
        });

        // 回车键支持
        folderInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                loadBtn.click();
            }
        });

        // 初始演示提示（无自动加载）
        setStatus('💡 示例：若存在 库/a/1.txt 和 库/a/2.png ，输入 a 即可顺序显示');
    })();
</script>
</body>
</html>
